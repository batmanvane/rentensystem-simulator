<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballerburg V5: Daten & Cockpit</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            border: 5px solid #34495e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
        }

        canvas { display: block; cursor: crosshair; }

        /* UI LAYER */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 15px; box-sizing: border-box;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        
        /* Checkbox Gruppen */
        .controls-left { display: flex; gap: 15px; }

        .hud-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 14px;
            pointer-events: auto; display: flex; align-items: center; gap: 8px;
            backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
        }

        .message-center {
            position: absolute; top: 70px; width: 100%; text-align: center;
            font-size: 32px; font-weight: 900; text-shadow: 2px 2px 0 #000;
            pointer-events: none; z-index: 10;
        }

        /* DATA PANEL UNTEN */
        .bottom-bar { display: flex; justify-content: center; margin-bottom: 10px; }
        
        .data-panel {
            background: rgba(0, 20, 40, 0.85);
            border: 2px solid #3498db;
            color: #3498db;
            padding: 10px 30px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: bold;
            display: flex; gap: 40px;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.3);
            min-width: 300px;
            justify-content: center;
        }
        
        .data-value { color: #fff; margin-left: 10px; }

        input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        label { cursor: pointer; user-select: none; }
        
        button#reset-btn {
            background: #e67e22; border: none; color: white;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        button#reset-btn:hover { background: #d35400; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="ui-layer">
            <div class="top-bar">
                <div class="controls-left">
                    <div class="hud-box">
                        <input type="checkbox" id="windCheck" checked>
                        <label for="windCheck">Wind</label>
                    </div>
                    <div class="hud-box">
                        <input type="checkbox" id="trajCheck" checked>
                        <label for="trajCheck">Hilfslinie</label>
                    </div>
                </div>

                <div class="message-center" id="statusText">Lade...</div>

                <div class="hud-box">
                    <span id="windDisplay">Wind: 0</span>
                    <div style="width:1px; height:15px; background:#555; margin:0 5px;"></div>
                    <button id="reset-btn">Reset</button>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="data-panel" id="dataPanel">
                    <span>Warten...</span>
                </div>
            </div>
        </div>
    </div>

<script>
window.addEventListener('load', function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Referenzen
    const uiStatus = document.getElementById('statusText');
    const uiWind = document.getElementById('windDisplay');
    const uiData = document.getElementById('dataPanel');
    const checkWind = document.getElementById('windCheck');
    const checkTraj = document.getElementById('trajCheck');
    const btnReset = document.getElementById('reset-btn');

    // KONSTANTEN
    const GROUND_Y = 450;
    const GRAVITY = 0.25;
    const POWER_SCALE = 0.18; 
    const WIND_SCALE = 0.06;
    const MAX_DRAG_DIST = 250; // Maximale Zieh-Länge für 100% Power

    // GAME STATE
    let game = {
        turn: 1,
        wind: 0,
        windEnabled: true,
        trajEnabled: true, // Flugbahn an/aus
        isAnimating: false,
        isAiming: false,
        aimVector: { x: 0, y: 0, power: 0, angle: 0 },
        ball: null,
        particles: [],
        players: [],
        obstacle: { x: 350, y: GROUND_Y - 180, w: 100, h: 180, color: '#7f8c8d' },
        trajectoryPoints: []
    };

    function init() {
        game.players = [
            { id: 1, x: 50, y: GROUND_Y - 60, w: 60, h: 60, hp: 100, color: '#3498db', name: "BLAU" },
            { id: 2, x: 690, y: GROUND_Y - 60, w: 60, h: 60, hp: 100, color: '#e74c3c', name: "ROT" }
        ];
        game.ball = null;
        game.particles = [];
        game.isAnimating = false;
        game.isAiming = false;
        game.turn = 1;
        randomizeWind();
        updateUI();
        updateDataPanel(false); // Panel leeren
        requestAnimationFrame(loop);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    function update() {
        // BALL LOGIK
        if (game.ball) {
            game.ball.vy += GRAVITY;
            game.ball.vx += game.wind * WIND_SCALE;
            game.ball.x += game.ball.vx;
            game.ball.y += game.ball.vy;

            // Live Energie-Anzeige update
            updateDataPanel(true);

            // Kollisionen
            let hit = false;
            
            // Boden
            if (game.ball.y >= GROUND_Y) { createExplosion(game.ball.x, GROUND_Y, "#27ae60"); hit = true; }
            // Berg
            else if (checkRectCollide(game.ball.x, game.ball.y, game.obstacle)) { createExplosion(game.ball.x, game.ball.y, game.obstacle.color); hit = true; }
            // Aus
            else if (game.ball.x < -100 || game.ball.x > canvas.width + 100) { hit = true; }
            // Gegner
            else {
                let enemy = game.players[game.turn === 1 ? 1 : 0];
                if (checkRectCollide(game.ball.x, game.ball.y, enemy)) {
                    enemy.hp -= 35;
                    createExplosion(game.ball.x, game.ball.y, enemy.color);
                    if (enemy.hp <= 0) finishGame(game.players[game.turn - 1].name);
                    else hit = true;
                }
            }

            if (hit) endTurn();
        }

        // Partikel
        for (let i = game.particles.length - 1; i >= 0; i--) {
            let p = game.particles[i];
            p.life--; p.x += p.vx; p.y += p.vy;
            if (p.life <= 0) game.particles.splice(i, 1);
        }
    }

    function draw() {
        // HIMMEL
        const grad = ctx.createLinearGradient(0, 0, 0, 500);
        grad.addColorStop(0, "#87CEEB"); grad.addColorStop(1, "#E0F6FF");
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // BERG
        ctx.fillStyle = game.obstacle.color;
        ctx.fillRect(game.obstacle.x, game.obstacle.y, game.obstacle.w, game.obstacle.h);
        ctx.strokeStyle = "#566573"; ctx.lineWidth = 3; ctx.strokeRect(game.obstacle.x, game.obstacle.y, game.obstacle.w, game.obstacle.h);

        // BODEN
        ctx.fillStyle = "#27ae60"; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

        // BURGEN
        game.players.forEach(p => {
            if (p.hp > 0) {
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
                // Kleines Detail: Fenster
                ctx.fillStyle = "#000"; ctx.fillRect(p.x + 15, p.y + 25, 10, 20); ctx.fillRect(p.x + 35, p.y + 25, 10, 20);
                drawHealthBar(p);
            }
        });

        // HILFSLINIE & TRAJEKTORIE (Nur wenn aktiviert und aiming)
        if (game.isAiming && !game.isAnimating) {
            drawAimLine();
            if (game.trajEnabled) drawTrajectory();
        }

        // BALL
        if (game.ball) {
            ctx.fillStyle = "#2c3e50"; ctx.beginPath();
            ctx.arc(game.ball.x, game.ball.y, 6, 0, Math.PI*2); ctx.fill();
            // Schweif
            ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(game.ball.x - game.ball.vx*2, game.ball.y - game.ball.vy*2);
            ctx.lineTo(game.ball.x, game.ball.y); ctx.stroke();
        }

        // PARTIKEL
        game.particles.forEach(p => {
            ctx.fillStyle = p.color; ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        });
    }

    // --- BERECHNUNGEN ---

    function updateAimVector(mx, my) {
        const activeP = game.players[game.turn - 1];
        const cx = activeP.x + activeP.w / 2;
        const cy = activeP.y + activeP.h / 2;
        
        let dx = mx - cx;
        let dy = my - cy;
        
        // Distanz (Kraft) berechnen
        let dist = Math.hypot(dx, dy);
        
        // Winkel berechnen (in Grad umrechnen für Anzeige)
        // Wir nehmen den Betrag von dx, um den Winkel immer relativ zum Boden zu haben (0-90°)
        // dy ist negativ wenn es nach oben geht.
        let rad = Math.atan2(-dy, Math.abs(dx)); 
        let deg = rad * (180 / Math.PI);
        if (deg < 0) deg = 0; // Kein Boden-Schuss

        // Limitieren
        if (dist > MAX_DRAG_DIST) {
            dx = (dx / dist) * MAX_DRAG_DIST;
            dy = (dy / dist) * MAX_DRAG_DIST;
            dist = MAX_DRAG_DIST;
        }
        
        game.aimVector = { 
            x: dx, 
            y: dy, 
            power: dist, // In Pixeln (0 bis 250)
            angle: deg 
        };
        
        updateDataPanel(false); // UI Update
        if (game.trajEnabled) calculateTrajectory();
    }

    function calculateTrajectory() {
        game.trajectoryPoints = [];
        const activeP = game.players[game.turn - 1];
        let simX = activeP.x + activeP.w / 2;
        let simY = activeP.y + activeP.h / 2;
        let simVX = game.aimVector.x * POWER_SCALE;
        let simVY = game.aimVector.y * POWER_SCALE;

        for (let i = 0; i < 150; i++) {
            simVY += GRAVITY;
            simVX += game.wind * WIND_SCALE;
            simX += simVX; simY += simVY;

            if (i % 4 === 0) game.trajectoryPoints.push({x: simX, y: simY});
            
            if (simY >= GROUND_Y || checkRectCollide(simX, simY, game.obstacle)) break;
        }
    }

    // --- UI UPDATER ---
    function updateDataPanel(inFlight) {
        if (inFlight && game.ball) {
            // Kinetische Energie: E = 0.5 * v^2 (Masse ignorieren wir bzw ist 1)
            let vTotal = Math.hypot(game.ball.vx, game.ball.vy);
            let energy = Math.round(0.5 * (vTotal * vTotal) * 10); // *10 für schönere Zahlen
            
            uiData.innerHTML = `STATUS: <span class="data-value">FLUG</span> 
                                ENERGIE: <span class="data-value" style="color:#e74c3c">${energy} J</span>`;
        } else if (game.isAiming) {
            let powerPct = Math.round((game.aimVector.power / MAX_DRAG_DIST) * 100);
            let angle = Math.round(game.aimVector.angle);
            
            uiData.innerHTML = `WINKEL: <span class="data-value">${angle}°</span> 
                                PULVER: <span class="data-value">${powerPct}%</span>`;
        } else {
            uiData.innerHTML = `<span>Zielen zum Starten...</span>`;
        }
    }

    // --- EVENTS & STEUERUNG ---
    canvas.addEventListener('mousedown', (e) => {
        if (game.isAnimating || game.ball) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left; const my = e.clientY - rect.top;
        const activeP = game.players[game.turn - 1];
        if (Math.hypot(mx - (activeP.x + 30), my - (activeP.y + 30)) < 150) {
            game.isAiming = true;
            updateAimVector(mx, my);
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (!game.isAiming) return;
        const rect = canvas.getBoundingClientRect();
        updateAimVector(e.clientX - rect.left, e.clientY - rect.top);
    });

    window.addEventListener('mouseup', () => {
        if (game.isAiming) { fire(); game.isAiming = false; game.trajectoryPoints = []; }
    });

    // Checkbox Events
    checkWind.addEventListener('change', (e) => { 
        game.windEnabled = e.target.checked; 
        randomizeWind(); 
        updateUI(); 
    });
    
    checkTraj.addEventListener('change', (e) => {
        game.trajEnabled = e.target.checked;
    });

    btnReset.addEventListener('click', init);

    // Standard Funktionen
    function fire() {
        const activeP = game.players[game.turn - 1];
        game.ball = {
            x: activeP.x + activeP.w / 2, y: activeP.y + activeP.h / 2,
            vx: game.aimVector.x * POWER_SCALE, vy: game.aimVector.y * POWER_SCALE
        };
        game.isAnimating = true;
        uiStatus.innerText = "";
    }
    function drawAimLine() {
        const activeP = game.players[game.turn - 1];
        const cx = activeP.x + activeP.w / 2; const cy = activeP.y + activeP.h / 2;
        let intensity = Math.min(1, game.aimVector.power / MAX_DRAG_DIST); 
        ctx.strokeStyle = `rgb(${255},${Math.floor(255*(1-intensity))},0)`;
        ctx.lineWidth = 3 + (intensity*4); ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + game.aimVector.x, cy + game.aimVector.y); ctx.stroke();
    }
    function drawTrajectory() {
        ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
        game.trajectoryPoints.forEach(pt => { ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill(); });
    }
    function drawHealthBar(p) {
        ctx.fillStyle = "#000"; ctx.fillRect(p.x, p.y - 25, p.w, 8);
        ctx.fillStyle = (p.hp/100) > 0.5 ? "#2ecc71" : "#e74c3c";
        ctx.fillRect(p.x + 1, p.y - 24, (p.w - 2) * Math.max(0, p.hp/100), 6);
    }
    function createExplosion(x, y, color) {
        for (let i = 0; i < 20; i++) {
            game.particles.push({x: x, y: y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 30+Math.random()*20, r: Math.random()*5+2, color: color});
        }
    }
    function checkRectCollide(bx, by, rect) { return bx > rect.x && bx < rect.x + rect.w && by > rect.y && by < rect.y + rect.h; }
    function endTurn() { game.ball = null; game.isAnimating = false; game.turn = game.turn === 1 ? 2 : 1; randomizeWind(); updateUI(); updateDataPanel(false); }
    function finishGame(winner) { game.ball = null; uiStatus.innerText = winner + " GEWINNT!"; uiStatus.style.color = "#f1c40f"; setTimeout(() => { if(confirm("Nochmal?")) init(); }, 500); }
    function randomizeWind() { game.wind = game.windEnabled ? (Math.random() * 3) - 1.5 : 0; }
    function updateUI() {
        const p = game.players[game.turn - 1]; uiStatus.innerText = p.name + " ist am Zug"; uiStatus.style.color = p.color;
        let dir = game.wind > 0 ? "→" : (Math.abs(game.wind) < 0.1 ? "•" : "←"); uiWind.innerText = `Wind: ${dir} ${Math.abs(game.wind).toFixed(1)}`;
    }

    init();
});
</script>
</body>
</html>
