<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Ballerburg Science: Wurfparabel & Daten</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        h1 { margin: 0 0 10px 0; font-size: 24px; }

        /* HAUPT LAYOUT */
        #main-container {
            display: flex;
            flex-direction: column;
            width: 1000px;
            max-width: 95vw;
            height: 90vh;
            gap: 15px;
        }

        /* SPIEL BEREICH (OBEN) */
        #game-section {
            position: relative;
            flex: 2; /* Nimmt 2/3 des Platzes */
            border: 4px solid #34495e;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas#gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* DASHBOARD BEREICH (UNTEN) */
        #dashboard-section {
            flex: 1; /* Nimmt 1/3 des Platzes */
            display: flex;
            gap: 15px;
            min-height: 200px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #7f8c8d;
        }

        /* DIAGRAMM */
        #chart-panel {
            flex: 2;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        canvas#chartCanvas {
            width: 100%;
            height: 100%;
            background: #ecf0f1;
            border-radius: 4px;
        }

        /* TABELLE & CONTROLS */
        #data-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .data-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;
        }

        #log-container {
            flex-grow: 1;
            overflow-y: auto;
            background: rgba(255,255,255,0.1);
            font-family: monospace;
            font-size: 12px;
            padding: 5px;
        }

        .log-entry { margin-bottom: 2px; border-bottom: 1px solid #555; display: flex; justify-content: space-between; }
        .log-entry span { margin-right: 10px; }

        /* UI OVERLAY IM SPIEL */
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 10px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 14px;
            pointer-events: auto; display: flex; align-items: center; gap: 8px; color: white;
        }

        .turn-msg {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 black;
        }

        button {
            background: #27ae60; border: none; color: white; padding: 5px 10px;
            cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 12px;
        }
        button:hover { background: #2ecc71; }
        button#reset-btn { background: #e67e22; }

    </style>
</head>
<body>

    <h1>Physik Labor: Die Wurfparabel</h1>

    <div id="main-container">
        
        <div id="game-section">
            <canvas id="gameCanvas" width="1000" height="500"></canvas>
            
            <div id="ui-overlay">
                <div class="hud-box">
                    <input type="checkbox" id="windCheck"> <label for="windCheck">Wind aktivieren</label>
                </div>
                <div class="turn-msg" id="statusText">Blau ist dran</div>
                <div class="hud-box">
                    <span id="windDisplay">Wind: 0</span>
                    <div style="width:1px; height:15px; background:#555; margin:0 5px;"></div>
                    <button id="reset-btn">Spiel Neustart</button>
                </div>
            </div>
        </div>

        <div id="dashboard-section">
            
            <div id="chart-panel" class="panel">
                <div style="position:absolute; top:5px; left:10px; color:#2c3e50; font-weight:bold; font-size:12px;">
                    Diagramm: Winkel (X) vs. Weite (Y)
                </div>
                <canvas id="chartCanvas" width="600" height="200"></canvas>
            </div>

            <div id="data-panel" class="panel">
                <div class="data-header">
                    <strong>Messwerte</strong>
                    <button onclick="exportCSV()">💾 CSV Export</button>
                </div>
                <div id="log-container">
                    </div>
            </div>

        </div>
    </div>

<script>
window.addEventListener('load', function() {
    // --- CANVAS REFERENZEN ---
    const gameCanvas = document.getElementById('gameCanvas');
    const ctx = gameCanvas.getContext('2d');
    
    const chartCanvas = document.getElementById('chartCanvas');
    const ctxChart = chartCanvas.getContext('2d');

    // --- UI REFERENZEN ---
    const uiStatus = document.getElementById('statusText');
    const uiWind = document.getElementById('windDisplay');
    const uiLog = document.getElementById('log-container');
    const checkWind = document.getElementById('windCheck');
    const btnReset = document.getElementById('reset-btn');

    // --- KONSTANTEN ---
    const GROUND_Y = 450;
    const GRAVITY = 0.25;
    const POWER_SCALE = 0.18; 
    const WIND_SCALE = 0.06;
    const MAX_DRAG_DIST = 250;

    // --- STATE ---
    let shotHistory = []; // Speichert alle Schüsse für Export und Chart

    let game = {
        turn: 1,
        wind: 0,
        windEnabled: false, // Standardmäßig aus für bessere Physik-Demo
        isAnimating: false,
        isAiming: false,
        aimVector: { x: 0, y: 0, power: 0, angle: 0 },
        ball: null,
        particles: [],
        players: [],
        obstacle: { x: 450, y: GROUND_Y - 150, w: 100, h: 150, color: '#7f8c8d' }, // Berg in der Mitte
        trajectoryPoints: []
    };

    // --- INIT ---
    function init() {
        game.players = [
            { id: 1, x: 50, y: GROUND_Y - 60, w: 60, h: 60, hp: 100, color: '#3498db', name: "BLAU" },
            { id: 2, x: 890, y: GROUND_Y - 60, w: 60, h: 60, hp: 100, color: '#e74c3c', name: "ROT" }
        ];
        game.ball = null;
        game.particles = [];
        game.isAnimating = false;
        game.turn = 1;
        game.shotStartPos = null; // Um Weite zu messen
        
        // Wind reset
        if(game.windEnabled) randomizeWind(); else game.wind = 0;
        
        updateUI();
        drawChart(); // Leeres Chart zeichnen
        requestAnimationFrame(loop);
    }

    // --- GAME LOOP ---
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    function update() {
        // BALL PHYSIK
        if (game.ball) {
            game.ball.vy += GRAVITY;
            game.ball.vx += game.wind * WIND_SCALE;
            game.ball.x += game.ball.vx;
            game.ball.y += game.ball.vy;

            let hit = false;
            let finalX = game.ball.x;
            
            // Boden
            if (game.ball.y >= GROUND_Y) { 
                createExplosion(game.ball.x, GROUND_Y, "#27ae60"); 
                hit = true; 
            }
            // Berg
            else if (checkRectCollide(game.ball.x, game.ball.y, game.obstacle)) { 
                createExplosion(game.ball.x, game.ball.y, game.obstacle.color); 
                hit = true; 
            }
            // Aus
            else if (game.ball.x < -100 || game.ball.x > gameCanvas.width + 100) { 
                hit = true; 
            }
            // Gegner
            else {
                let enemy = game.players[game.turn === 1 ? 1 : 0];
                if (checkRectCollide(game.ball.x, game.ball.y, enemy)) {
                    enemy.hp -= 35;
                    createExplosion(game.ball.x, game.ball.y, enemy.color);
                    hit = true;
                    if (enemy.hp <= 0) setTimeout(() => { alert(game.players[game.turn-1].name + " GEWINNT!"); init(); shotHistory=[]; uiLog.innerHTML=""; }, 100);
                }
            }

            if (hit) {
                // DATENERFASSUNG
                recordShot(finalX);
                endTurn();
            }
        }

        // Partikel
        for (let i = game.particles.length - 1; i >= 0; i--) {
            let p = game.particles[i];
            p.life--; p.x += p.vx; p.y += p.vy;
            if (p.life <= 0) game.particles.splice(i, 1);
        }
    }

    function draw() {
        // HIMMEL
        const grad = ctx.createLinearGradient(0, 0, 0, 500);
        grad.addColorStop(0, "#87CEEB"); grad.addColorStop(1, "#E0F6FF");
        ctx.fillStyle = grad; ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

        // HINDERNIS
        ctx.fillStyle = game.obstacle.color; 
        ctx.fillRect(game.obstacle.x, game.obstacle.y, game.obstacle.w, game.obstacle.h);
        
        // BODEN
        ctx.fillStyle = "#27ae60"; ctx.fillRect(0, GROUND_Y, gameCanvas.width, gameCanvas.height - GROUND_Y);

        // BURGEN
        game.players.forEach(p => {
            if (p.hp > 0) {
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
                // HP
                ctx.fillStyle = "black"; ctx.fillRect(p.x, p.y - 20, p.w, 5);
                ctx.fillStyle = "lime"; ctx.fillRect(p.x, p.y - 20, p.w * (p.hp/100), 5);
            }
        });

        // HILFSLINIEN (AIMING)
        if (game.isAiming && !game.isAnimating) {
            drawAimLine();
            drawTrajectory();
        }

        // BALL
        if (game.ball) {
            ctx.fillStyle = "#2c3e50"; ctx.beginPath();
            ctx.arc(game.ball.x, game.ball.y, 6, 0, Math.PI*2); ctx.fill();
            // Schweif
            ctx.strokeStyle = "white"; ctx.beginPath(); ctx.moveTo(game.ball.x - game.ball.vx*3, game.ball.y - game.ball.vy*3); ctx.lineTo(game.ball.x, game.ball.y); ctx.stroke();
        }
        
        // PARTIKEL
        game.particles.forEach(p => {
            ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        });
    }

    // --- DATEN & CHART ---

    function recordShot(finalX) {
        // Berechnung der Distanz
        // Wir nehmen die Distanz vom Abschusspunkt
        let activeP = game.players[game.turn - 1];
        let startX = activeP.x + activeP.w/2;
        let distance = Math.abs(finalX - startX);

        // Winkel normalisieren (immer positiv 0-90)
        let angle = Math.round(game.aimVector.angle);
        if (game.turn === 2) angle = 180 - angle; // S2 zielt nach links, wir wollen aber den Steigungswinkel
        angle = Math.abs(angle);

        let power = Math.round((game.aimVector.power / MAX_DRAG_DIST) * 100);

        let dataPoint = {
            id: shotHistory.length + 1,
            player: activeP.name,
            color: activeP.color,
            angle: angle,
            power: power,
            distance: Math.round(distance),
            wind: game.wind.toFixed(2)
        };

        shotHistory.push(dataPoint);
        addLogEntry(dataPoint);
        drawChart();
    }

    function addLogEntry(d) {
        let div = document.createElement('div');
        div.className = 'log-entry';
        div.style.color = d.color;
        div.innerHTML = `<span>#${d.id}</span> <span>${d.angle}°</span> <span>${d.power}% Kraft</span> <span>-> ${d.distance}m</span>`;
        uiLog.prepend(div); // Neues oben
    }

    // --- CHART ZEICHNEN (CANVAS) ---
    function drawChart() {
        const w = chartCanvas.width;
        const h = chartCanvas.height;
        ctxChart.clearRect(0,0,w,h);

        // Achsen (Abstände)
        const pad = 30;
        
        // Gitter zeichnen
        ctxChart.strokeStyle = "#bdc3c7";
        ctxChart.lineWidth = 1;
        ctxChart.beginPath();
        // Y-Achse
        ctxChart.moveTo(pad, pad); ctxChart.lineTo(pad, h-pad);
        // X-Achse
        ctxChart.moveTo(pad, h-pad); ctxChart.lineTo(w-pad, h-pad);
        ctxChart.stroke();

        // Labels
        ctxChart.fillStyle = "#2c3e50";
        ctxChart.font = "10px Arial";
        ctxChart.fillText("0m", 5, h-pad);
        ctxChart.fillText("Weite (Y)", 5, pad - 5);
        ctxChart.fillText("Winkel (X)", w - 50, h - 10);
        
        // X-Achse Markierungen (0° bis 90°)
        for(let deg=0; deg<=90; deg+=15) {
            let x = pad + (deg / 90) * (w - 2*pad);
            ctxChart.fillText(deg+"°", x-5, h-10);
            ctxChart.fillRect(x, h-pad-2, 1, 4); // Tick
        }

        // DATEN PUNKTE
        if (shotHistory.length === 0) return;

        // Skalierung Y-Achse: Wir suchen die max Weite
        let maxDist = Math.max(...shotHistory.map(s => s.distance), 800); // Min 800 width

        shotHistory.forEach(s => {
            // X-Koordinate: Winkel (0-90)
            let px = pad + (s.angle / 90) * (w - 2*pad);
            
            // Y-Koordinate: Weite
            // 0 ist unten (h-pad), maxDist ist oben (pad)
            let py = (h - pad) - (s.distance / maxDist) * (h - 2*pad);

            // Punkt malen
            ctxChart.fillStyle = s.color;
            ctxChart.beginPath();
            ctxChart.arc(px, py, 4, 0, Math.PI*2);
            ctxChart.fill();
            
            // Umrandung für bessere Sichtbarkeit
            ctxChart.strokeStyle = "black";
            ctxChart.lineWidth = 1;
            ctxChart.stroke();
        });
    }

    // --- CSV EXPORT ---
    window.exportCSV = function() {
        if(shotHistory.length === 0) { alert("Keine Daten vorhanden."); return; }
        
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "ID;Spieler;Winkel(Grad);Kraft(%);Wind;Weite(Pixel)\n"; // Header

        shotHistory.forEach(function(row) {
            let rowStr = `${row.id};${row.player};${row.angle};${row.power};${row.wind};${row.distance}`;
            csvContent += rowStr + "\n";
        });

        // Download Link erzwingen
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "ballerburg_messdaten.csv");
        document.body.appendChild(link); // Required for FF
        link.click();
        document.body.removeChild(link);
    };

    // --- STEUERUNG (MAUS) ---
    // Zurück zur klassischen Maussteuerung (V5)
    
    function updateAimVector(mx, my) {
        const activeP = game.players[game.turn - 1];
        const cx = activeP.x + activeP.w / 2;
        const cy = activeP.y + activeP.h / 2;
        let dx = mx - cx; let dy = my - cy;
        let dist = Math.hypot(dx, dy);
        
        // Winkel
        let rad = Math.atan2(-dy, Math.abs(dx)); // Immer positiv relativ zum Boden
        let deg = rad * (180 / Math.PI);
        if (deg < 0) deg = 0;

        if (dist > MAX_DRAG_DIST) {
            dx = (dx / dist) * MAX_DRAG_DIST;
            dy = (dy / dist) * MAX_DRAG_DIST;
            dist = MAX_DRAG_DIST;
        }
        
        game.aimVector = { x: dx, y: dy, power: dist, angle: deg };
        calculateTrajectory();
    }

    function calculateTrajectory() {
        game.trajectoryPoints = [];
        const activeP = game.players[game.turn - 1];
        let simX = activeP.x + activeP.w / 2;
        let simY = activeP.y + activeP.h / 2;
        let simVX = game.aimVector.x * POWER_SCALE;
        let simVY = game.aimVector.y * POWER_SCALE;

        for (let i = 0; i < 150; i++) {
            simVY += GRAVITY; simVX += game.wind * WIND_SCALE;
            simX += simVX; simY += simVY;
            if (i % 4 === 0) game.trajectoryPoints.push({x: simX, y: simY});
            if (simY >= GROUND_Y || checkRectCollide(simX, simY, game.obstacle)) break;
        }
    }

    gameCanvas.addEventListener('mousedown', (e) => {
        if (game.isAnimating) return;
        const rect = gameCanvas.getBoundingClientRect();
        const activeP = game.players[game.turn - 1];
        if (Math.hypot((e.clientX-rect.left) - (activeP.x + 30), (e.clientY-rect.top) - (activeP.y + 30)) < 150) {
            game.isAiming = true;
            updateAimVector(e.clientX - rect.left, e.clientY - rect.top);
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (!game.isAiming) return;
        const rect = gameCanvas.getBoundingClientRect();
        updateAimVector(e.clientX - rect.left, e.clientY - rect.top);
    });

    window.addEventListener('mouseup', () => {
        if (game.isAiming) {
            const activeP = game.players[game.turn - 1];
            game.ball = {
                x: activeP.x + activeP.w / 2, y: activeP.y + activeP.h / 2,
                vx: game.aimVector.x * POWER_SCALE, vy: game.aimVector.y * POWER_SCALE
            };
            game.isAnimating = true;
            game.isAiming = false;
        }
    });

    // --- HELPER ---
    function drawAimLine() {
        const activeP = game.players[game.turn - 1];
        const cx = activeP.x + activeP.w / 2; const cy = activeP.y + activeP.h / 2;
        let intensity = Math.min(1, game.aimVector.power / MAX_DRAG_DIST); 
        ctx.strokeStyle = `rgb(${255},${Math.floor(255*(1-intensity))},0)`;
        ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + game.aimVector.x, cy + game.aimVector.y); ctx.stroke();
    }
    function drawTrajectory() {
        ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
        game.trajectoryPoints.forEach(pt => { ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill(); });
    }
    function createExplosion(x, y, color) { for (let i = 0; i < 20; i++) game.particles.push({x:x,y:y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:30+Math.random()*20,r:Math.random()*5,color:color}); }
    function checkRectCollide(bx, by, rect) { return bx > rect.x && bx < rect.x + rect.w && by > rect.y && by < rect.y + rect.h; }
    function endTurn() { game.ball = null; game.isAnimating = false; game.turn = game.turn === 1 ? 2 : 1; if(game.windEnabled) randomizeWind(); else game.wind=0; updateUI(); }
    function randomizeWind() { game.wind = (Math.random() * 3) - 1.5; }
    function updateUI() { 
        uiStatus.innerText = game.players[game.turn-1].name + " ist dran"; 
        uiStatus.style.color = game.players[game.turn-1].color;
        let dir = game.wind > 0 ? "→" : (Math.abs(game.wind)<0.1?"•":"←"); 
        uiWind.innerText = `Wind: ${dir} ${Math.abs(game.wind).toFixed(2)}`;
    }
    
    checkWind.addEventListener('change', (e) => { game.windEnabled = e.target.checked; if(!game.windEnabled) game.wind = 0; updateUI(); });
    btnReset.addEventListener('click', init);

    init();
});
</script>
</body>
</html>
